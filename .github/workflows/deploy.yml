name: Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v4
      with:
        node-version: 16
    - run: yarn install
    - run: yarn build
      env:
        NODE_ENV: production
    - name: Publish
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CF_API_TOKEN }}
        accountId: ${{ secrets.CF_ACCOUNT_ID }}
        wranglerVersion: "2.21.3"
        command: publish --env production
        preCommands: >-
          KV_NAMESPACE_ID=$(yarn wrangler kv:namespace list | node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk).on("end",()=>{const namespace=JSON.parse(data).find(item=>item.title.endsWith("KV_STATUS_PAGE"));process.stdout.write(namespace ? namespace.id : "")})');
          if [ -z "$KV_NAMESPACE_ID" ]; then yarn wrangler kv:namespace create KV_STATUS_PAGE; KV_NAMESPACE_ID=$(yarn wrangler kv:namespace list | node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk).on("end",()=>{const namespace=JSON.parse(data).find(item=>item.title.endsWith("KV_STATUS_PAGE"));process.stdout.write(namespace ? namespace.id : "")})'); fi;
          test -n "$KV_NAMESPACE_ID" && printf '\n[env.production]\nkv_namespaces = [{binding="KV_STATUS_PAGE", id="%s"}]\n' "$KV_NAMESPACE_ID" >> wrangler.toml
        postCommands: |
          yarn kv-gc
        secrets: |
          SECRET_SLACK_WEBHOOK_URL
          SECRET_TELEGRAM_API_TOKEN
          SECRET_TELEGRAM_CHAT_ID
          SECRET_DISCORD_WEBHOOK_URL
        environment: production
      env:
        CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        SECRET_SLACK_WEBHOOK_URL: ${{ secrets.SECRET_SLACK_WEBHOOK_URL || 'default-gh-action-secret' }}
        SECRET_TELEGRAM_API_TOKEN: ${{ secrets.SECRET_TELEGRAM_API_TOKEN || 'default-gh-action-secret' }}
        SECRET_TELEGRAM_CHAT_ID: ${{ secrets.SECRET_TELEGRAM_CHAT_ID || 'default-gh-action-secret' }}
        SECRET_DISCORD_WEBHOOK_URL: ${{ secrets.SECRET_DISCORD_WEBHOOK_URL || 'default-gh-action-secret' }}
